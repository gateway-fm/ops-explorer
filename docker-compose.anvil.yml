services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "2"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: explorer
    ports:
      - "5432:5432"
    volumes:
      - postgres_anvil_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/api"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: http://anvil:8545
      API_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/indexer"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: http://anvil:8545
      POLL_INTERVAL: "1s"
      START_BLOCK: "0"
      CATCHUP_WORKERS: "2"
      RPC_WORKERS: "10"
      RPC_RATE_LIMIT: "100"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_anvil_data:
