# Production overrides. Use with EITHER mode:
#
#   Standalone mode (anvil + chain-indexer + indexer-postgres bundled):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       --profile standalone up -d
#     # Or, with dev-friendly defaults pre-set: make standalone
#
#   Privacy mode (chain data via privacy-proxy; that stack must be running):
#     docker compose -f docker-compose.yml -f docker-compose.privacy.yml \
#       -f docker-compose.prod.yml up -d
#     # Or: make run-privacy
#
# Requires Docker Compose v2.x (uses !reset tag for port/volume overrides).
#
# What this changes vs the base file:
#   - Frontend runs the compiled nginx image instead of the Vite dev server
#   - PostgreSQL port is not exposed to the host
#
# Required environment variables (no defaults — fail-to-start if unset):
#   DATABASE_URL                  postgres://user:pass@host:5432/explorer?sslmode=require
#   RPC_URL                       Real RPC endpoint, or http://anvil:8545
#                                 to use the bundled standalone anvil
#   INDEXER_POSTGRES_PASSWORD     Standalone profile only — protects bundled
#                                 indexer-postgres
#
# Optional:
#   INDEXER_VERSION               chain-indexer image tag, defaults to `latest`
#                                 (pin to a release tag in production)
#
# The Makefile `standalone` target pre-sets dev-friendly values for all
# of the above so `make standalone` works OOTB locally; raw `docker
# compose ... up` invocations require the operator to provide them
# explicitly so production deployments don't accidentally inherit
# local dev defaults.
#
# Chain-data source — pick EXACTLY ONE. Setting both is rejected at
# startup (privacy footgun: chain data would bypass privacy-proxy's
# redaction). Standalone deployments set INDEXER_URL; privacy mode sets
# PRIVACY_PROXY_URL via docker-compose.privacy.yml's env or the operator's
# env file.
#
#   Standalone mode — chain-indexer direct, raw chain data:
#     INDEXER_URL               chain-indexer:50051 (or external indexer)
#
#   Privacy mode — reads routed through privacy-proxy, redaction applied:
#     PRIVACY_PROXY_URL         http://privacy-proxy-backend:8080
#     PRIVACY_PROXY_PUBLIC_URL  https://proxy.yourdomain.com
#     SSO_REDIRECT_URI          https://explorer.yourdomain.com/api/auth/callback
#
# Operators running block-explorer alongside privacy-proxy SHOULD NOT
# enable the standalone profile — chain-indexer comes from privacy-proxy's
# compose network in that mode, and running a second copy would split
# the indexed state.

services:
  postgres:
    ports: !reset []   # Internal only — not exposed to host in production

  # Standalone-profile chain-indexer trio. `--profile standalone` brings
  # up indexer-postgres + chain-indexer + a default anvil. anvil is
  # included so the profile is self-contained — operators replacing
  # anvil with a real upstream RPC just override `RPC_URL` in their
  # env (and they MAY remove anvil from their compose invocation if
  # they prefer; but the default is a working stack).
  #
  # Privacy-mode deployments leave these off and point api at
  # privacy-proxy via docker-compose.privacy.yml instead.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: [standalone]
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "2"]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  indexer-postgres:
    image: postgres:16-alpine
    profiles: [standalone]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required for the standalone profile}
      POSTGRES_DB: chain_indexer
    volumes:
      - indexer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chain_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  chain-indexer:
    image: ghcr.io/gateway-fm/chain-indexer:${INDEXER_VERSION:-latest}
    profiles: [standalone]
    environment:
      DATABASE_URL: postgres://postgres:${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required for the standalone profile}@indexer-postgres:5432/chain_indexer?sslmode=disable
      # RPC_URL must be set explicitly. The bundled anvil service can
      # serve as the source — point this at it with
      # RPC_URL=http://anvil:8545. Production deployments should set
      # this to a real RPC endpoint and may remove anvil from the
      # compose invocation.
      RPC_URL: ${RPC_URL:?RPC_URL is required (e.g. http://anvil:8545 for the bundled dev chain, or your real RPC endpoint)}
      GRPC_LISTEN_ADDR: ":50051"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      indexer-postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RPC_URL: ${RPC_URL:?RPC_URL is required}
      # Pick exactly one of INDEXER_URL / PRIVACY_PROXY_URL — the api
      # process rejects having both set. Standalone deployments set
      # INDEXER_URL (e.g. chain-indexer:50051 for the bundled service);
      # privacy-mode deployments set PRIVACY_PROXY_URL.
      INDEXER_URL: ${INDEXER_URL:-}
      PRIVACY_PROXY_URL: ${PRIVACY_PROXY_URL:-}
      PRIVACY_PROXY_PUBLIC_URL: ${PRIVACY_PROXY_PUBLIC_URL:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    # Host port mapping inherited from base compose (${API_PORT:-8081}:8080).
    # Operators behind a reverse proxy can override `API_PORT` to bind a
    # firewalled port, or layer their own override file to add `ports: !reset []`.

  public-api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RPC_URL: ${RPC_URL:?RPC_URL is required}
      # public-api also reads chain data via chain-indexer (RD-855 Phase 6).
      # Operator must set INDEXER_URL — same as api, no default.
      INDEXER_URL: ${INDEXER_URL:-}
    # See `api` above for the port-mapping rationale.

  # indexer service removed — chain data comes from gateway-fm/chain-indexer
  # (RD-855 Phase 6). Set INDEXER_URL on the api service to point at it.
  # The standalone profile above brings up a chain-indexer alongside this
  # stack for self-contained deployments.

  # Replace dev server with compiled nginx image
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gatewayfm/block-explorer-frontend:${BLOCK_EXPLORER_VERSION:-latest}
    working_dir: !reset ""  # Clear dev working_dir so nginx uses its own root
    command: !reset []       # Clear dev command so Dockerfile CMD (nginx) runs
    volumes: !reset []       # No source mount in production
    # nginx in the prod image listens on :80 (different from the Vite
    # dev server on :3001), so the dev port mapping has to be replaced
    # rather than inherited. Reset then re-add with the correct internal
    # port so `make standalone` is reachable on host:${FRONTEND_PORT:-3001}
    # OOTB. Operators behind a reverse proxy can layer an override
    # to drop the binding entirely.
    ports: !override
      - "${FRONTEND_PORT:-3001}:80"
    environment:
      VITE_API_URL: /api

volumes:
  indexer_postgres_data:
