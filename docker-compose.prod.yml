# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires Docker Compose v2.x (uses !reset tag for port/volume overrides).
#
# What this changes vs the base file:
#   - Frontend runs the compiled nginx image instead of the Vite dev server
#   - PostgreSQL port is not exposed to the host
#   - DATABASE_URL and RPC_URL must be provided via environment — no hardcoded defaults
#   - SSO redirect URI and public URLs must be set for the real domain (privacy mode only)
#
# Always required:
#   DATABASE_URL  postgres://user:pass@host:5432/explorer?sslmode=require
#   RPC_URL       https://rpc.yourdomain.com
#
# Chain-data source — pick EXACTLY ONE. Setting both is rejected at
# startup (privacy footgun: chain data would bypass privacy-proxy's
# redaction). Setting neither is also rejected.
#
#   Standalone mode — chain-indexer direct, raw chain data:
#     INDEXER_URL  chain-indexer:50051   # or host:port of the gRPC endpoint
#
#   Privacy mode — reads routed through privacy-proxy, redaction applied:
#     PRIVACY_PROXY_URL         http://privacy-proxy-backend:8080
#     PRIVACY_PROXY_PUBLIC_URL  https://proxy.yourdomain.com
#     SSO_REDIRECT_URI          https://explorer.yourdomain.com/api/auth/callback
#
# Standalone deployment helper — opt in with `--profile standalone`:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile standalone up -d
#
# That brings up `indexer-postgres` and `chain-indexer` (pulled from
# ghcr.io/gateway-fm/chain-indexer, pinned via INDEXER_VERSION)
# alongside the api/frontend so the standalone path is self-contained.
# Set INDEXER_URL=chain-indexer:50051 on api when using this profile.
# Operators running block-explorer alongside privacy-proxy SHOULD NOT
# enable this profile — chain-indexer comes from privacy-proxy's
# compose network in that mode, and running a second copy would split
# the indexed state.
#
# Note: if deploying alongside privacy-proxy, the external network must exist first:
#   docker network create privacy-proxy_proxy-network

services:
  postgres:
    ports: !reset []   # Internal only — not exposed to host in production

  # Standalone-profile: chain-indexer + its postgres. Only started with
  # `--profile standalone`. The privacy-mode deployment leaves these off
  # and points api at privacy-proxy instead.
  indexer-postgres:
    image: postgres:16-alpine
    profiles: [standalone]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required for the standalone profile}
      POSTGRES_DB: chain_indexer
    volumes:
      - indexer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chain_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  chain-indexer:
    image: ghcr.io/gateway-fm/chain-indexer:${INDEXER_VERSION:-latest}
    profiles: [standalone]
    environment:
      DATABASE_URL: postgres://postgres:${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required for the standalone profile}@indexer-postgres:5432/chain_indexer?sslmode=disable
      RPC_URL: ${RPC_URL:?RPC_URL is required}
      GRPC_LISTEN_ADDR: ":50051"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      indexer-postgres:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RPC_URL: ${RPC_URL:?RPC_URL is required}
      # Pick exactly one of INDEXER_URL / PRIVACY_PROXY_URL — the api
      # process rejects having both set.
      INDEXER_URL: ${INDEXER_URL:-}
      PRIVACY_PROXY_URL: ${PRIVACY_PROXY_URL:-}
      PRIVACY_PROXY_PUBLIC_URL: ${PRIVACY_PROXY_PUBLIC_URL:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    ports: !reset []   # Not exposed directly — sit behind a reverse proxy

  # indexer service removed — chain data comes from gateway-fm/chain-indexer
  # (RD-855 Phase 6). Set INDEXER_URL on the api service to point at it.
  # The standalone profile above brings up a chain-indexer alongside this
  # stack for self-contained deployments.

  # Replace dev server with compiled nginx image
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gatewayfm/block-explorer-frontend:${BLOCK_EXPLORER_VERSION:-latest}
    working_dir: !reset ""  # Clear dev working_dir so nginx uses its own root
    command: !reset []       # Clear dev command so Dockerfile CMD (nginx) runs
    volumes: !reset []       # No source mount in production
    ports: !reset []         # Not exposed directly — sit behind a reverse proxy
    environment:
      VITE_API_URL: /api

volumes:
  indexer_postgres_data:
