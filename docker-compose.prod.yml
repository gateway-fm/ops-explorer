# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires Docker Compose v2.x (uses !reset tag for port/volume overrides).
#
# What this changes vs the base file:
#   - Frontend runs the compiled nginx image instead of the Vite dev server
#   - PostgreSQL port is not exposed to the host
#   - DATABASE_URL and RPC_URL must be provided via environment — no hardcoded defaults
#   - SSO redirect URI and public URLs must be set for the real domain (privacy mode only)
#
# Standalone mode — required env vars:
#   DATABASE_URL  postgres://user:pass@host:5432/explorer?sslmode=require
#   RPC_URL       https://rpc.yourdomain.com
#
# Privacy mode — additional required env vars:
#   PRIVACY_PROXY_URL         http://privacy-proxy-backend:8080
#   PRIVACY_PROXY_PUBLIC_URL  https://proxy.yourdomain.com
#   SSO_REDIRECT_URI          https://explorer.yourdomain.com/api/auth/callback
#
# Note: if deploying alongside privacy-proxy, the external network must exist first:
#   docker network create privacy-proxy_proxy-network

services:
  postgres:
    ports: !reset []   # Internal only — not exposed to host in production

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RPC_URL: ${RPC_URL:?RPC_URL is required}
      PRIVACY_PROXY_URL: ${PRIVACY_PROXY_URL:-}
      PRIVACY_PROXY_PUBLIC_URL: ${PRIVACY_PROXY_PUBLIC_URL:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    ports: !reset []   # Not exposed directly — sit behind a reverse proxy

  indexer:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RPC_URL: ${RPC_URL:?RPC_URL is required}

  # Replace dev server with compiled nginx image
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gatewayfm/block-explorer-frontend:${BLOCK_EXPLORER_VERSION:-latest}
    volumes: !reset []   # No source mount in production
    ports: !reset []     # Not exposed directly — sit behind a reverse proxy
    environment:
      VITE_API_URL: /api