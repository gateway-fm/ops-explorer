# Dev override bringing up gateway-fm/ops-indexer alongside the dev
# stack. Uses pull_policy: never — the local image is a prerequisite
# (`make docker-build` in ../chain-indexer). See README.

services:
  indexer-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chain_indexer
    volumes:
      - indexer_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chain_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chain-indexer:
    image: gatewayfm/chain-indexer:latest
    pull_policy: never
    environment:
      DATABASE_URL: postgres://postgres:postgres@indexer-postgres:5432/chain_indexer?sslmode=disable
      RPC_URL: http://anvil:8545
      GRPC_LISTEN_ADDR: ":50051"
      LOG_LEVEL: ${INDEXER_LOG_LEVEL:-info}
    depends_on:
      indexer-postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  api:
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      chain-indexer:
        condition: service_started

  public-api:
    environment:
      INDEXER_URL: chain-indexer:50051
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      chain-indexer:
        condition: service_started

volumes:
  indexer_postgres_dev_data:
