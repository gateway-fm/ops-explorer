# =============================================================================
# Block Explorer — Production Docker Compose (Standalone)
# =============================================================================
#
# Self-contained production deployment of block-explorer with all
# configuration documented. Brings up:
#
#   - postgres            (block-explorer's own DB)
#   - indexer-postgres    (chain-indexer's DB)
#   - chain-indexer       (indexes the chain into indexer-postgres,
#                          serves gRPC on :50051)
#   - api                 (block-explorer api, reads chain data from
#                          chain-indexer over gRPC)
#   - public-api          (rate-limited read-only API for third-party
#                          consumers)
#   - frontend            (React SPA served by nginx)
#
# Operators running block-explorer behind privacy-proxy do NOT use
# this file — privacy-proxy's own compose stack provides chain-indexer.
# Use the repo-root `docker-compose.yml` + `docker-compose.privacy.yml`
# overlay instead (or `make run-privacy`).
#
# Quick start:
#
#   1. Copy this file and fill in your values (or export them as env vars):
#        cp examples/docker-compose.production.yml docker-compose.production.yml
#   2. Required env vars (compose fails to start without them):
#        POSTGRES_PASSWORD              block-explorer DB password
#        INDEXER_POSTGRES_PASSWORD      chain-indexer DB password
#        RPC_URL                        upstream chain RPC endpoint
#        CHAIN_ID                       decimal chain ID for MetaMask
#   3. Run:
#        docker compose -f docker-compose.production.yml up -d
#
# Images are published on each release:
#   block-explorer:  gatewayfm/block-explorer-{api,public-api,frontend}
#                    Pin via VERSION env var (defaults to `latest` —
#                    NOT recommended for production).
#   chain-indexer:   gatewayfm/chain-indexer
#                    Pin via INDEXER_VERSION env var.
#
# Pin to a specific release in production. Example:
#   VERSION=0.5.0 INDEXER_VERSION=v1.2.3 docker compose ... up -d
#
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # postgres — block-explorer's data store (verifications, etc.)
  # ---------------------------------------------------------------------------
  # Note: most chain data lives in indexer-postgres now (RD-855 Phase 6).
  # block-explorer's own postgres holds verifications and api-side state.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-explorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-explorer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-explorer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # indexer-postgres — chain-indexer's data store (blocks, txs, logs, etc.)
  # ---------------------------------------------------------------------------
  indexer-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INDEXER_POSTGRES_PASSWORD:?Set INDEXER_POSTGRES_PASSWORD}
      POSTGRES_DB: chain_indexer
    volumes:
      - indexer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chain_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # chain-indexer — indexes blocks/txs/logs from RPC into indexer-postgres,
  # serves gRPC on :50051 for the api/public-api to consume.
  # ---------------------------------------------------------------------------
  chain-indexer:
    image: gatewayfm/chain-indexer:${INDEXER_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://postgres:${INDEXER_POSTGRES_PASSWORD}@indexer-postgres:5432/chain_indexer?sslmode=disable
      RPC_URL: ${RPC_URL:?Set RPC_URL to your chain RPC endpoint}
      GRPC_LISTEN_ADDR: ":50051"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      indexer-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # api — Serves the explorer frontend and internal API
  # ---------------------------------------------------------------------------
  api:
    image: gatewayfm/block-explorer-api:${VERSION:-latest}
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      # --- Required ---
      DATABASE_URL: postgres://${POSTGRES_USER:-explorer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-explorer}?sslmode=disable
      RPC_URL: ${RPC_URL:?Set RPC_URL}
      # Standalone mode — chain data via chain-indexer over gRPC.
      INDEXER_URL: chain-indexer:50051

      # --- Server ---
      API_PORT: "8080"                              # Internal port (mapped via Docker)
      SOLC_PATH: /opt/solc                          # Path to solc binaries for contract verification

      # --- Privacy mode (optional) ---
      # If you want to route chain reads through privacy-proxy for
      # RBAC redaction instead of going direct to chain-indexer:
      # 1. Comment out INDEXER_URL above (api rejects both being set).
      # 2. Set the values below. Block-explorer also has to be on
      #    privacy-proxy's network — see docker-compose.privacy.yml in
      #    the repo root for the canonical wiring.
      # PRIVACY_PROXY_URL: http://privacy-proxy-backend:8080
      # PRIVACY_PROXY_PUBLIC_URL: https://privacy.example.com
      # SSO_CLIENT_ID: explorer
      # SSO_REDIRECT_URI: https://explorer.example.com/api/auth/callback
    depends_on:
      postgres:
        condition: service_healthy
      chain-indexer:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # public-api — Rate-limited read-only API for external consumers
  # ---------------------------------------------------------------------------
  public-api:
    image: gatewayfm/block-explorer-public-api:${VERSION:-latest}
    ports:
      - "${PUBLIC_API_PORT:-8082}:8082"
    environment:
      # --- Required ---
      DATABASE_URL: postgres://${POSTGRES_USER:-explorer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-explorer}?sslmode=disable
      RPC_URL: ${RPC_URL:?Set RPC_URL}
      # public-api also reads chain data via chain-indexer (RD-855 Phase 6).
      INDEXER_URL: chain-indexer:50051

      # --- Server ---
      PUBLIC_API_PORT: "8082"                       # Internal port (mapped via Docker)

      # --- Rate limiting ---
      RATE_LIMIT: ${RATE_LIMIT:-100}                # Max requests per time window per IP
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}   # Time window (e.g. 30s, 1m, 5m)
    depends_on:
      postgres:
        condition: service_healthy
      chain-indexer:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — React SPA served by nginx with runtime config injection
  # ---------------------------------------------------------------------------
  # The entrypoint.sh script generates /config.js from VITE_* env vars at
  # container startup. No rebuild needed when configuration changes.
  frontend:
    image: gatewayfm/block-explorer-frontend:${VERSION:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # --- Runtime configuration (injected at container startup) ---

      # --- API connection ---
      VITE_API_URL: /api                            # Path to internal API (proxied via nginx/ingress)
      VITE_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8082}  # Public API URL for API docs "Try it"

      # --- Chain config ---
      VITE_CHAIN_ID: ${CHAIN_ID:?Set CHAIN_ID}     # Chain ID (decimal) for MetaMask integration
      VITE_NETWORK_NAME: ${NETWORK_NAME:-My Chain}  # Network name shown in MetaMask
      VITE_NETWORK_CURRENCY: ${NETWORK_CURRENCY:-ETH}  # Native currency symbol
      VITE_RPC_URL: ${RPC_URL}                      # RPC URL for MetaMask "Add Network"

      # --- Branding (all optional — defaults to Gateway branding) ---
      VITE_BRAND_NAME: ${BRAND_NAME:-Gateway Explorer}
      VITE_BRAND_COMPANY: ${BRAND_COMPANY:-Gateway.fm AS}
      VITE_BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-Block Explorer - Browse blocks, transactions, and accounts}
      VITE_BRAND_LOGO: ${BRAND_LOGO:-/logo.svg}                    # Path or URL
      VITE_BRAND_ICON: ${BRAND_ICON:-/mascot.png}                  # Path or URL (also used as favicon)
      VITE_BRAND_FAVICON: ${BRAND_FAVICON:-}                       # Optional separate favicon
      VITE_BRAND_COLOR_PRIMARY: ${BRAND_COLOR_PRIMARY:-#8950FA}    # Hex color for buttons, links, accents
      VITE_BRAND_COLOR_HERO_BG: ${BRAND_COLOR_HERO_BG:-}           # Optional CSS gradient for hero section

      # --- Branding links (set to empty string to hide) ---
      VITE_BRAND_WEBSITE: ${BRAND_WEBSITE:-https://gateway.fm/}
      VITE_BRAND_DOCS: ${BRAND_DOCS:-https://docs.gateway.fm/}
      VITE_BRAND_LEGAL: ${BRAND_LEGAL:-https://gateway.fm/legal/}
      VITE_BRAND_SECURITY: ${BRAND_SECURITY:-https://gateway.fm/security/}
      VITE_BRAND_TRUST: ${BRAND_TRUST:-https://trust.gateway.fm}

      # --- Branding social links (set to empty string to hide) ---
      VITE_BRAND_TWITTER: ${BRAND_TWITTER:-https://x.com/gateway_eth}
      VITE_BRAND_LINKEDIN: ${BRAND_LINKEDIN:-https://www.linkedin.com/company/gatewayfm}
      VITE_BRAND_DISCORD: ${BRAND_DISCORD:-https://discord.gg/grPXnEbAyv}
      VITE_BRAND_TELEGRAM: ${BRAND_TELEGRAM:-https://t.me/gateway_fm}
    depends_on:
      - api
      - public-api
    restart: unless-stopped

volumes:
  postgres_data:
  indexer_postgres_data:
