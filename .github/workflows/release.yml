name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  release-api:
    name: Release API Image
    runs-on: ubuntu-latest
    # id-token: write enables cosign keyless signing via GitHub OIDC — no
    # stored signing keys (org policy: no static credentials).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gatewayfm/block-explorer-api
          tags: |
            type=semver,pattern={{version}}
          # Disable the action's default `latest=auto` flavor — Docker Hub
          # has tag-immutability enabled on these repos, so re-pushing
          # `latest` on every release fails. Publish only the semver tag.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=block-explorer-api
            org.opencontainers.image.description=Block Explorer API Service (standalone build — links chain-indexer gRPC client)
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ github.event.release.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build identity stamped into the binary via -ldflags. The build context
      # is backend/, which excludes .git, so compute these on the runner and
      # forward them as build-args. VERSION is the release tag.
      - name: Resolve build metadata
        id: build_meta
        run: |
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push API image (standalone)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend/
          file: backend/Dockerfile.api
          # Pin the build target explicitly so the published image is
          # determined by name, not by Dockerfile stage order. Without
          # `target:`, BuildKit picks the LAST `FROM ... AS` stage —
          # which silently flips the variant if anyone reorders the
          # Dockerfile or adds a stage. RD-922.
          target: standalone
          push: true
          platforms: linux/amd64,linux/arm64
          # Supply-chain attestations (RD-1171 image-release HOLD list):
          # a syft-generated SBOM plus max-detail SLSA build provenance,
          # attached to the image as OCI attestation manifests.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ steps.build_meta.outputs.short_sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature via the workflow's OIDC identity; verifiable with
      # `cosign verify --certificate-identity-regexp 'github.com/gateway-fm/ops-explorer'
      #  --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>`.
      # Signing by digest (not tag) so the signature is immune to tag moves.
      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "gatewayfm/block-explorer-api@${DIGEST}"

  release-api-privacy:
    name: Release API Image (privacy build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Privacy variant: built with -tags privacy so the
    # internal/api/indexerclient package (chain-indexer gRPC client) is
    # excluded at compile time. Used by privacy-mode deployments where
    # direct chain-indexer access would bypass Open Privacy Suite redaction.
    # Published as a separately-named image (RD-922) so the privacy
    # compose can pin by image name rather than depending on the
    # standalone repo to never link the gRPC client.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gatewayfm/block-explorer-api-privacy
          tags: |
            type=semver,pattern={{version}}
          # Disable the action's default `latest=auto` flavor — Docker Hub
          # has tag-immutability enabled on these repos, so re-pushing
          # `latest` on every release fails. Publish only the semver tag.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=block-explorer-api-privacy
            org.opencontainers.image.description=Block Explorer API Service (privacy build — chain-indexer gRPC client compiled out)
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ github.event.release.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build identity stamped into the binary via -ldflags (see release-api).
      - name: Resolve build metadata
        id: build_meta
        run: |
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push API image (privacy)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend/
          file: backend/Dockerfile.api
          target: privacy
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ steps.build_meta.outputs.short_sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "gatewayfm/block-explorer-api-privacy@${DIGEST}"


  release-public-api:
    name: Release Public API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gatewayfm/block-explorer-public-api
          tags: |
            type=semver,pattern={{version}}
          # Disable the action's default `latest=auto` flavor — Docker Hub
          # has tag-immutability enabled on these repos, so re-pushing
          # `latest` on every release fails. Publish only the semver tag.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=block-explorer-public-api
            org.opencontainers.image.description=Block Explorer Public API Service
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ github.event.release.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build identity stamped into the binary via -ldflags (see release-api).
      - name: Resolve build metadata
        id: build_meta
        run: |
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Public API image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend/
          file: backend/Dockerfile.public-api
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ steps.build_meta.outputs.short_sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "gatewayfm/block-explorer-public-api@${DIGEST}"

  release-frontend:
    name: Release Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gatewayfm/block-explorer-frontend
          tags: |
            type=semver,pattern={{version}}
          # Disable the action's default `latest=auto` flavor — Docker Hub
          # has tag-immutability enabled on these repos, so re-pushing
          # `latest` on every release fails. Publish only the semver tag.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=block-explorer-frontend
            org.opencontainers.image.description=Block Explorer Frontend
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ github.event.release.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Frontend image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "gatewayfm/block-explorer-frontend@${DIGEST}"

  # Source SBOM (SPDX JSON) attached to the GitHub Release — the
  # source-artifact counterpart of the per-image SBOM attestations above.
  # Skipped on workflow_dispatch, which has no release to attach to.
  release-source-sbom:
    name: Source SBOM (SPDX)
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM as a release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Generate and attach SPDX source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: block-explorer-source-${{ github.ref_name }}.spdx.json
