name: Preview Images

# Builds and pushes frontend, api and public-api images from a pull request BEFORE review/merge, so
# the change can be deployed next to the current one (e.g. the Tickr
# `explorer-preview.` host in dev-gateway-eks-cluster) and compared side by side.
#
# Trigger: add the `preview` label to a PR (a draft is fine). Every later push to
# that PR builds again. Adding any OTHER label does not: it would rebuild the
# same commit, and the push fails on the immutable tag. Only PRs from branches
# of THIS repo build: fork PRs get no secrets, and the job is skipped for them
# rather than failing.
#
# Tag: `sha-<7>` of the PR head commit, matching the ops-indexer branch builds.
# Docker Hub tag immutability is on, so re-running the same commit fails at push;
# push a new commit instead. The digest is printed in the job summary; pin it as
# `gatewayfm/block-explorer-frontend:sha-<7>@sha256:<digest>`.
#
# arm64 only: EKS is Graviton-only, and a native arm runner avoids QEMU.

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Build and push preview frontend
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    # Job-level, not workflow-level: a run for an unrelated label skips this job
    # and so must not cancel a build that is already in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=sha-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: gatewayfm/block-explorer-frontend:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=block-explorer-frontend
            org.opencontainers.image.description=Block Explorer Frontend (PR preview)
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=preview-frontend
          cache-to: type=gha,mode=max,scope=preview-frontend

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Preview frontend image (PR #${PR})"
            echo
            echo '```'
            echo "gatewayfm/block-explorer-frontend:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Build and push preview ${{ matrix.image }}
    # Same trigger and rules as the frontend job above. The api image is the
    # standalone target, as in release.yml.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: block-explorer-api
            dockerfile: backend/Dockerfile.api
            target: standalone
          - image: block-explorer-public-api
            dockerfile: backend/Dockerfile.public-api
            target: ""
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ matrix.image }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve tag and build metadata
        id: tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "tag=sha-${HEAD_SHA::7}"
            echo "short_sha=${HEAD_SHA::8}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/arm64
          tags: gatewayfm/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Block Explorer ${{ matrix.image }} (PR preview)
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            GIT_COMMIT=${{ steps.tag.outputs.short_sha }}
            BUILD_TIME=${{ steps.tag.outputs.build_time }}
          cache-from: type=gha,scope=preview-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.image }}

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Preview ${IMAGE} image (PR #${PR})"
            echo
            echo '```'
            echo "gatewayfm/${IMAGE}:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
