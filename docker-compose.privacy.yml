# Privacy-mode overlay — layer on top of docker-compose.yml when this
# block-explorer is reading chain data through the Open Privacy Suite.
#
# Only attaches the api / public-api / postgres services to the
# privacy-proxy_proxy-network so they can reach `privacy-proxy-backend`
# and so the Open Privacy Suite can reach `explorer-postgres` (postgres alias).
# That network is created by the Open Privacy Suite compose stack — operators
# MUST start the Open Privacy Suite stack first. (The privacy-proxy_* runtime
# names are the suite's original compose identifiers, unchanged by the GitHub
# repo rename to open-privacy-suite.)
#
# Standalone deploys (Makefile `standalone` / `run` / `dev` targets)
# never load this file and therefore don't need the
# privacy-proxy_proxy-network to exist. That fixes the prior gotcha
# where attempting to bring up the explorer stack alone failed with
# `network privacy-proxy_proxy-network declared as external, but
# could not be found`.
#
# Override `PROXY_NETWORK` in the environment if your Open Privacy Suite
# stack uses a different external network name (rare).
services:
  postgres:
    networks:
      default:
      privacy-proxy:
        aliases:
          - explorer-postgres

  api:
    # Privacy-mode dev defaults (e.g. `make run-privacy` over HTTP localhost).
    # docker-compose.prod.yml overrides BOTH of these for an HTTPS prod deploy.
    environment:
      # W-1: REQUIRED in privacy mode (empty → fail-closed startup error).
      # Localhost default so `make run-privacy` works OOTB; the prod overlay
      # drops it to fail-closed so prod must name its real HTTPS origins.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3001},http://localhost:5173}
      # A-3: the BFF forces Secure cookies in privacy mode; browsers drop Secure
      # cookies over plain HTTP, so use false for the HTTP dev stack. The prod
      # overlay flips this to true (forced Secure) for HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - default
      - privacy-proxy

  public-api:
    networks:
      - default
      - privacy-proxy

networks:
  privacy-proxy:
    external: true
    name: ${PROXY_NETWORK:-privacy-proxy_proxy-network}
