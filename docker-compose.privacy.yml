# Privacy-mode overlay — layer on top of docker-compose.yml when this
# block-explorer is reading chain data through privacy-proxy.
#
# Only attaches the api / public-api / postgres services to the
# privacy-proxy_proxy-network so they can reach `privacy-proxy-backend`
# and so privacy-proxy can reach `explorer-postgres` (postgres alias).
# That network is created by privacy-proxy's compose stack — operators
# MUST start privacy-proxy first.
#
# Standalone deploys (Makefile `standalone` / `run` / `dev` targets)
# never load this file and therefore don't need the
# privacy-proxy_proxy-network to exist. That fixes the prior gotcha
# where attempting to bring up the explorer stack alone failed with
# `network privacy-proxy_proxy-network declared as external, but
# could not be found`.
#
# Override `PROXY_NETWORK` in the environment if your privacy-proxy
# stack uses a different external network name (rare).
services:
  postgres:
    networks:
      default:
      privacy-proxy:
        aliases:
          - explorer-postgres

  api:
    networks:
      - default
      - privacy-proxy

  public-api:
    networks:
      - default
      - privacy-proxy

networks:
  privacy-proxy:
    external: true
    name: ${PROXY_NETWORK:-privacy-proxy_proxy-network}
