services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "2"]
    ports:
      - "${ANVIL_PORT:-8546}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: explorer
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/api"]
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: http://anvil:8545
      API_PORT: "8080"
    volumes:
      - solc_binaries:/opt/solc
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/indexer"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: http://anvil:8545
      POLL_INTERVAL: "1s"
      START_BLOCK: "0"
      CATCHUP_WORKERS: "2"
      RPC_WORKERS: "10"
      RPC_RATE_LIMIT: "100"
      ENABLE_TRACING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  public-api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile.public-api
    ports:
      - "${PUBLIC_API_PORT:-8082}:8082"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: http://anvil:8545
      PUBLIC_API_PORT: "8082"
      RATE_LIMIT: ${RATE_LIMIT:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      VITE_API_URL: /api
      VITE_PUBLIC_API_URL: http://localhost:${PUBLIC_API_PORT:-8082}
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3001"
    depends_on:
      - api
      - public-api
    restart: unless-stopped

volumes:
  postgres_dev_data:
  frontend_node_modules:
  solc_binaries:
