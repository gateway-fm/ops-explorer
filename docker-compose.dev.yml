services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "2"]
    ports:
      - "${ANVIL_PORT:-8546}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: explorer
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/api"]
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: http://anvil:8545
      API_PORT: "8080"
      # Dev compose uses standalone mode — chain data comes direct from
      # chain-indexer over gRPC (RD-855 Phase 6). Clone
      # gateway-fm/chain-indexer as a sibling and bring up its
      # docker-compose alongside this one; that stack exposes a service
      # at chain-indexer:50051 reachable on this shared network.
      #
      # Do NOT also set PRIVACY_PROXY_URL here — the api rejects having
      # both INDEXER_URL and PRIVACY_PROXY_URL set. For privacy-mode dev,
      # unset INDEXER_URL and use the compose-override pattern to point
      # PRIVACY_PROXY_URL at a running privacy-proxy instead.
      INDEXER_URL: ${INDEXER_URL:-chain-indexer:50051}
    volumes:
      - solc_binaries:/opt/solc
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  # Block-explorer's own indexer service was retired (RD-855 Phase 6).
  # Chain data comes from gateway-fm/chain-indexer.

  public-api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile.public-api
    ports:
      - "${PUBLIC_API_PORT:-8082}:8082"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: http://anvil:8545
      PUBLIC_API_PORT: "8082"
      RATE_LIMIT: ${RATE_LIMIT:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      VITE_API_URL: /api
      VITE_PUBLIC_API_URL: http://localhost:${PUBLIC_API_PORT:-8082}
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3001"
    depends_on:
      - api
      - public-api
    restart: unless-stopped

volumes:
  postgres_dev_data:
  frontend_node_modules:
  solc_binaries:
