# Markdown pages for AI agents (`<page URL>/llm.md`, `/llms.txt`) are served
# by the public-api. A request for an HTML page that asks for Markdown
# (`Accept: text/markdown`) is rewritten to the page's `/llm.md` URL.
map $uri $llm_md_uri {
    "/"           /llm.md;
    ~^(?<p>.*?)/?$ $p/llm.md;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API proxy
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A-3: forward the original scheme so the API's COOKIE_SECURE=auto can
        # emit Secure cookies when TLS was terminated at the edge.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://api:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Markdown pages -> public-api. The upstream is a variable so nginx starts
    # even where no `public-api` host resolves (the SPA keeps working; only
    # these paths then fail with 502). 127.0.0.11 is Docker's embedded DNS,
    # matching the compose service names used above.
    location ~ (^|/)llm\.md$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $public_api http://public-api:8082;
        proxy_pass $public_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $public_api http://public-api:8082;
        proxy_pass $public_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime config — never cache (regenerated on container restart)
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets - return 404 if not found (never serve index.html as JS/CSS)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (HTML routes only)
    location / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^ $llm_md_uri last;
        }
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html so new builds are picked up immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
