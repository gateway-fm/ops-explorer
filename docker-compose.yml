services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: explorer
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/api"]
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: ${RPC_URL:-http://${PROXY_HOST:-privacy-proxy-backend}:8080}
      API_PORT: "8080"
      SOLC_PATH: /opt/solc
      # Chain-data source — pick EXACTLY ONE of the two below by
      # setting it in your environment / .env. This base compose
      # deliberately does NOT default either: the operator must make
      # an explicit mode choice.
      #
      #   INDEXER_URL        standalone mode: reads go direct to
      #                      chain-indexer over gRPC. Raw chain data,
      #                      no privacy redaction. Use for standalone
      #                      deployments of block-explorer.
      #
      #   PRIVACY_PROXY_URL  privacy mode: reads routed through
      #                      privacy-proxy's REST explorer API.
      #                      Privacy-proxy applies RBAC-based redaction
      #                      before returning data.
      #
      # The api process rejects both-set and neither-set at startup.
      # For a zero-config standalone dev stack, layer
      # docker-compose.dev.yml on top — it defaults INDEXER_URL.
      INDEXER_URL: ${INDEXER_URL:-}
      PRIVACY_PROXY_URL: ${PRIVACY_PROXY_URL:-}
      PRIVACY_PROXY_PUBLIC_URL: ${PRIVACY_PROXY_PUBLIC_URL:-http://localhost:${HOST_PORT_PROXY:-8080}}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-explorer}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:${FRONTEND_PORT:-3001}/api/auth/callback}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Block-explorer's own indexer was retired in RD-855 Phase 6. Chain
  # data now comes from gateway-fm/chain-indexer. This compose expects
  # chain-indexer to be reachable at INDEXER_URL (default:
  # chain-indexer:50051 on the shared privacy-proxy network). For a
  # fully standalone local dev stack, clone chain-indexer as a sibling
  # and bring up its docker-compose alongside this one.

  public-api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile.public-api
    ports:
      - "${PUBLIC_API_PORT:-8082}:8082"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: ${RPC_URL:-http://privacy-proxy-backend:8080}
      PUBLIC_API_PORT: "8082"
      RATE_LIMIT: ${RATE_LIMIT:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      VITE_API_URL: /api
      VITE_PUBLIC_API_URL: http://localhost:${PUBLIC_API_PORT:-8082}
      # MetaMask "Add Network" config (RD-1031). VITE_RPC_URL is a
      # standalone/node concern: it is the node's browser-facing public RPC
      # that a wallet connects to directly when there is no privacy-proxy.
      # In privacy mode the wallet does NOT use this — it connects via a
      # locally-run jwt-injector configured client-side in the in-app MetaMask
      # setup dialog — so we never default it to the proxy /rpc endpoint here.
      # Defaults to the node's local RPC for dev/standalone.
      VITE_RPC_URL: ${VITE_RPC_URL:-http://localhost:8545}
      VITE_CHAIN_ID: ${VITE_CHAIN_ID:-${CHAIN_ID:-}}
      VITE_NETWORK_NAME: ${VITE_NETWORK_NAME:-${NETWORK_NAME:-}}
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3001"
    depends_on:
      - api
      - public-api
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
