services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: explorer
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
      privacy-proxy:
        aliases:
          - explorer-postgres

  api:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/api"]
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: ${RPC_URL:-http://privacy-proxy-backend:8080}
      API_PORT: "8080"
      SOLC_PATH: /opt/solc
      PRIVACY_ENABLED: ${PRIVACY_ENABLED:-true}
      PRIVACY_PROXY_URL: ${PRIVACY_PROXY_URL:-http://privacy-proxy-backend:8080}
      PRIVACY_PROXY_PUBLIC_URL: ${PRIVACY_PROXY_PUBLIC_URL:-http://localhost:8080}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-explorer}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:3001/api/auth/callback}
    networks:
      - default
      - privacy-proxy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/indexer"]
    networks:
      - default
      - privacy-proxy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/explorer?sslmode=disable
      RPC_URL: ${RPC_URL:-http://privacy-proxy-anvil:8545}
      POLL_INTERVAL: "2s"
      START_BLOCK: ${START_BLOCK:-0}
      # Tuning - reduce these if your RPC gets overwhelmed (EOF errors)
      CATCHUP_WORKERS: ${CATCHUP_WORKERS:-10}
      RPC_WORKERS: ${RPC_WORKERS:-50}
      RPC_RATE_LIMIT: ${RPC_RATE_LIMIT:-500}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      VITE_API_URL: /api
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3001"
    depends_on:
      - api
    restart: unless-stopped

networks:
  privacy-proxy:
    external: true
    name: privacy-proxy_proxy-network

volumes:
  postgres_data:
  frontend_node_modules:
